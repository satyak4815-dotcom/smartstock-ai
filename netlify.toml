# Netlify Configuration for SmartStock AI Frontend
# Note: Netlify hosts the static frontend build.
# For API calls to work, point the backend proxy to your deployed Python FastAPI service (e.g. on Render / Railway).

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) routing: redirect all page routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy /api requests to your live backend (replace with your Render / Railway URL if deploying frontend on Netlify)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-smartstock-backend.onrender.com/api/:splat"
#   status = 200
#   force = true
